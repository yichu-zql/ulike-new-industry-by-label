<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="基于久谦商品数据，自定义品类打标、人工复核与行业竞争研究。"><title>品类研究工作台 · Ulike</title><link rel="stylesheet" href="styles.css?v=4.0.0"><link rel="stylesheet" href="workbench/workbench.css?v=4.0.0"><script type="module" src="workbench/app.js?v=4.0.0"></script></head>
<body><header class="masthead"><a class="identity" href="./"><span class="monogram">U</span><span><b>ULIKE <span class="identity-light">品类研究</span></b><small>DEFINE · REVIEW · UNDERSTAND</small></span></a><div class="header-actions"><span id="save-state">本机工作区</span><button class="quiet" id="guide">口径与使用说明 ↗</button></div></header>
<main><section class="intro"><div><div class="eyebrow">JIUQIAN / RESEARCH WORKBENCH</div><h1>让品类定义，连接竞争判断。</h1><p>确定范围，复核商品，再看清市场中的变化。</p></div><span class="version">工作台 4.0<span>原研究快照保留 · 2026.11.05</span></span></section>
<section class="workspace" aria-label="全局分析范围"><div class="research-picker"><label for="category">研究品类</label><select id="category" aria-label="研究品类"></select><span id="revision" class="badge"></span><button id="edit-category" class="text-button">编辑定义</button><button id="new-category" class="button">＋ 新建品类</button></div><div class="filters"><label>平台<select id="platform"><option value="all">三平台合计</option><option value="tmall">天猫</option><option value="jd">京东</option><option value="douyin">抖音</option></select></label><label>时段<select id="period"><option value="ytd">最新年累计</option><option value="r12">近12个月</option><option value="2025">2025全年</option><option value="2024">2024全年</option><option value="2023">2023全年</option><option value="custom">自定义月份</option></select></label><label>起始<input id="from" type="month" aria-label="起始月份"></label><label>截止<input id="to" type="month" aria-label="截止月份"></label><button id="reset" class="quiet">重置范围</button></div></section>
<div class="scope-note"><span class="note-marker">!</span><span id="data-note">正在读取数据范围…</span></div>
<nav class="view-tabs" aria-label="工作台视图"><button data-view="overview" aria-current="page">竞争概览</button><button data-view="review">打标复核</button><button data-view="manage">品类与数据</button><span id="scope-caption"></span></nav>
<div id="status" role="status" aria-live="polite">正在初始化工作台…</div><div id="content" aria-busy="true"></div>
<footer><span>久谦商品样本 · 统一商品集合计算 · <a href="legacy.html">查看原研究 v3 ↗</a></span><span>规则与复核仅存本浏览器 · 未配置云同步与自动更新</span></footer></main>
<dialog id="detail"><div class="dialog-head"><span id="dialog-eyebrow"></span><button id="close-dialog" aria-label="关闭详情">×</button></div><div id="dialog-content"></div></dialog><div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="dataset-file" accept=".json,application/json" hidden><input type="file" id="backup-file" accept=".json,application/json" hidden>
</body></html>
